name: Build debug APK

# Builds an installable debug APK (no signing secrets needed) and attaches it
# to the run as an artifact. Start it from the "Actions" tab ("Run workflow")
# or it runs on every push.

on:
  push:
  workflow_dispatch:

jobs:
  build-debug:
    name: Build dev debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDevDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Loader-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
